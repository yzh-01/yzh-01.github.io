<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>设计稿 B · 纸墨风 · yzh 的小站</title>
<style>
  /* ===== Tokens ===== */
  :root{
    --paper:     #f5f1e8;       /* 宣纸感米色 */
    --paper-2:   #ece6d7;
    --ink:       #1a1714;
    --ink-soft:  #4a443c;
    --ink-mute:  #807766;
    --rule:      #c7bda5;
    --accent:    #b8451f;       /* 朱砂红 */
    --serif: "Source Han Serif SC", "Noto Serif SC", "Songti SC", Georgia, serif;
    --sans:  "Source Han Sans SC", "Noto Sans SC", -apple-system, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.85;-webkit-font-smoothing:antialiased}
  /* Subtle paper texture using layered gradients (no images) */
  body{
    background-image:
      radial-gradient(2px 2px at 20% 30%, #c7bda5 1px, transparent 1px),
      radial-gradient(2px 2px at 70% 60%, #c7bda5 1px, transparent 1px),
      radial-gradient(1px 1px at 40% 80%, #c7bda5 1px, transparent 1px),
      linear-gradient(var(--paper), var(--paper));
    background-size: 200px 200px, 250px 250px, 180px 180px, auto;
  }

  /* Layout */
  .page{max-width:720px;margin:0 auto;padding:120px 24px 96px;position:relative}

  /* Masthead */
  .mast{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:18px;margin-bottom:80px}
  .mast .name{font-size:14px;letter-spacing:.3em;font-family:var(--sans);color:var(--ink-mute);text-transform:uppercase}
  .mast .vol{font-size:13px;color:var(--ink-mute);font-style:italic}

  /* Hero — editorial */
  .hero{margin-bottom:96px}
  .hero .eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:.36em;color:var(--accent);text-transform:uppercase;margin-bottom:28px}
  .hero h1{font-size:clamp(44px,7vw,86px);font-weight:400;letter-spacing:-.02em;line-height:1.05;margin-bottom:24px}
  .hero h1 .em{font-style:italic;color:var(--accent)}
  .hero .lede{font-size:19px;color:var(--ink-soft);max-width:34em;line-height:1.7}

  /* Ink drop animation on h1 */
  .ink{display:inline-block;opacity:0;transform:translateY(8px);animation:drop .9s cubic-bezier(.2,.7,.2,1) forwards}
  .ink:nth-child(2){animation-delay:.15s}
  .ink:nth-child(3){animation-delay:.3s}
  @keyframes drop{to{opacity:1;transform:none}}

  /* Section header — drop cap style */
  .sec{margin-top:96px}
  .sec .label{font-family:var(--sans);font-size:11px;letter-spacing:.4em;color:var(--ink-mute);text-transform:uppercase;margin-bottom:32px;display:flex;align-items:center;gap:14px}
  .sec .label::before, .sec .label::after{content:"";flex:1;border-top:1px solid var(--rule)}

  /* Article list */
  .essay{padding:28px 0;border-bottom:1px solid var(--rule);cursor:pointer;transition:padding .35s ease}
  .essay:hover{padding-left:12px}
  .essay .num{font-family:var(--sans);font-size:12px;color:var(--accent);letter-spacing:.2em;margin-bottom:6px;display:block}
  .essay h3{font-size:28px;font-weight:400;line-height:1.25;margin-bottom:8px;transition:color .25s}
  .essay:hover h3{color:var(--accent)}
  .essay .byline{font-family:var(--sans);font-size:13px;color:var(--ink-mute);font-style:italic}

  /* Floating side-note */
  .pull{margin-top:64px;padding:36px;background:var(--paper-2);border-left:3px solid var(--accent);font-size:18px;font-style:italic;color:var(--ink-soft);position:relative;transform:rotate(-.4deg)}
  .pull::before{content:"\201C";position:absolute;top:-12px;left:14px;font-size:60px;color:var(--accent);font-family:var(--serif);line-height:1}

  /* Footer */
  .colophon{margin-top:120px;padding-top:24px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;font-family:var(--sans);font-size:12px;color:var(--ink-mute);letter-spacing:.1em}
  .colophon a{color:var(--ink-mute);text-decoration:none;border-bottom:1px solid var(--rule)}

  @media (prefers-reduced-motion: reduce){
    .ink{opacity:1;transform:none;animation:none}
    .essay:hover{padding-left:0}
  }
</style>
</head>
<body>
<main class="page">
  <header class="mast">
    <span class="name">yzh 的小站</span>
    <span class="vol">vol. 01 · 2026</span>
  </header>

  <section class="hero">
    <div class="eyebrow">Personal Journal · 技术 × 生活</div>
    <h1>
      <span class="ink">记录</span>
      <span class="ink">那些</span>
      <span class="ink"><span class="em">值得</span>记下的。</span>
    </h1>
    <p class="lede">代码、生活、思考。一个关于"二十来岁应该做点什么"的答案。</p>
  </section>

  <section class="sec">
    <div class="label">目录 · contents</div>

    <article class="essay">
      <span class="num">NO. 002</span>
      <h3>软件工程期末复习</h3>
      <div class="byline">2026.07.20 · 学习笔记</div>
    </article>

    <article class="essay">
      <span class="num">NO. 001</span>
      <h3>No.0 Day</h3>
      <div class="byline">2026.07.20 · 随笔</div>
    </article>
  </section>

  <aside class="pull">
    一切都隐没在迷雾中。过去被清除，连清除行为也被忘却，谎言变成了事实。
  </aside>

  <footer class="colophon">
    <span>// set in Songti SC & Inter</span>
    <span><a href="#">GitHub</a> · <a href="#">RSS</a></span>
  </footer>
</main>
</body>
</html>
