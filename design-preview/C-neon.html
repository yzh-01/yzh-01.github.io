<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>设计稿 C · 赛博霓虹 · yzh 的小站</title>
<style>
  :root{
    --bg-0: #06030d;
    --bg-1: #0d0820;
    --ink:  #f4f0ff;
    --mute: #9892b8;
    --magenta: #ff2bd6;
    --cyan:    #00f0ff;
    --violet:  #7a5cff;
    --amber:   #ffb648;
    --sans: "Inter", "Source Han Sans SC", "Noto Sans SC", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg-0);color:var(--ink);font-family:var(--sans);min-height:100vh}
  body{
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(122,92,255,.35) 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 30%, rgba(255,43,214,.22) 0%, transparent 55%),
      radial-gradient(700px 500px at 50% 110%, rgba(0,240,255,.18) 0%, transparent 55%),
      var(--bg-0);
    background-attachment: fixed;
  }

  /* Animated grid */
  .grid{
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(122,92,255,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(122,92,255,.08) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    animation: drift 16s linear infinite;
  }
  @keyframes drift{from{background-position:0 0,0 0}to{background-position:56px 56px,56px 56px}}

  /* Scanlines */
  .scan{position:fixed;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px);mix-blend-mode:overlay}

  main{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:64px 28px 120px}

  /* Topbar */
  nav{display:flex;align-items:center;gap:18px;font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.18em;text-transform:uppercase}
  nav .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan);animation:pulse 2s ease-in-out infinite}
  nav .spacer{flex:1}
  nav a{color:var(--mute);text-decoration:none;border-bottom:1px solid transparent;transition:color .2s, border-color .2s}
  nav a:hover{color:var(--cyan);border-color:var(--cyan)}

  /* Hero */
  .hero{padding:80px 0 60px;position:relative}
  .eyebrow{font-family:var(--mono);font-size:12px;color:var(--cyan);letter-spacing:.36em;text-transform:uppercase;margin-bottom:24px;display:inline-flex;align-items:center;gap:10px}
  .eyebrow::before{content:"";width:24px;height:1px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}

  .glitch{
    font-size:clamp(46px,8vw,108px);
    font-weight:800;
    letter-spacing:-.03em;
    line-height:1;
    background: linear-gradient(90deg, var(--cyan), var(--magenta) 60%, var(--amber));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    position:relative;
  }
  .glitch::before, .glitch::after{
    content:attr(data-text);position:absolute;left:0;top:0;width:100%;background:var(--bg-0);-webkit-background-clip:text;background-clip:text;color:transparent;
    mix-blend-mode:screen;
  }
  .glitch::before{transform:translate(2px,0);filter:hue-rotate(40deg);animation:g1 3.6s infinite steps(8)}
  .glitch::after{transform:translate(-2px,0);filter:hue-rotate(-40deg);animation:g2 3.6s infinite steps(8)}
  @keyframes g1{0%,90%,100%{clip-path:inset(0 0 0 0)}92%{clip-path:inset(10% 0 60% 0)}94%{clip-path:inset(60% 0 10% 0)}}
  @keyframes g2{0%,88%,100%{clip-path:inset(0 0 0 0)}90%{clip-path:inset(50% 0 30% 0)}93%{clip-path:inset(20% 0 50% 0)}}

  .sub{margin-top:24px;font-size:18px;color:var(--ink);max-width:38ch;line-height:1.5}
  .sub .accent{color:var(--cyan);font-family:var(--mono)}

  /* HUD stats row */
  .hud{display:flex;gap:0;margin:60px 0 0;border:1px solid rgba(122,92,255,.4);border-radius:14px;overflow:hidden;background:rgba(13,8,32,.6);backdrop-filter:blur(8px)}
  .hud .cell{flex:1;padding:18px 22px;border-right:1px solid rgba(122,92,255,.25);position:relative}
  .hud .cell:last-child{border-right:none}
  .hud .k{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.24em;text-transform:uppercase;margin-bottom:6px}
  .hud .v{font-size:28px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .hud .v.g{background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hud .cell::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:linear-gradient(90deg,var(--cyan),var(--magenta));animation:fill 4s ease-in-out infinite}
  .hud .cell:nth-child(1)::after{animation-delay:0s}
  .hud .cell:nth-child(2)::after{animation-delay:.5s}
  .hud .cell:nth-child(3)::after{animation-delay:1s}
  .hud .cell:nth-child(4)::after{animation-delay:1.5s}
  @keyframes fill{0%,80%,100%{width:0}40%,60%{width:100%}}

  /* Post list — neon rows */
  .list{margin-top:64px;border-top:1px solid rgba(122,92,255,.25)}
  .row{
    display:grid;grid-template-columns:90px 1fr auto;gap:24px;align-items:center;
    padding:22px 12px;border-bottom:1px solid rgba(122,92,255,.25);
    text-decoration:none;color:inherit;
    transition:padding .25s, background .25s;
    position:relative;
  }
  .row::before{
    content:"";position:absolute;left:-2px;top:0;height:100%;width:2px;background:var(--cyan);transform:scaleY(0);transform-origin:center;transition:transform .25s;
    box-shadow:0 0 12px var(--cyan);
  }
  .row:hover{background:rgba(0,240,255,.05);padding-left:24px}
  .row:hover::before{transform:scaleY(1)}
  .row .idx{font-family:var(--mono);font-size:12px;color:var(--cyan);letter-spacing:.16em}
  .row .t{font-size:22px;font-weight:600}
  .row .tags{display:flex;gap:6px}
  .row .tag{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid rgba(255,43,214,.5);color:var(--magenta);letter-spacing:.08em}

  /* CTA */
  .cta{margin-top:64px;padding:36px;border:1px solid rgba(0,240,255,.4);border-radius:18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg, rgba(122,92,255,.12), rgba(0,240,255,.05))}
  .cta p{font-size:16px;color:var(--ink);max-width:32ch}
  .cta button{font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;padding:12px 22px;border-radius:99px;border:1px solid var(--cyan);background:transparent;color:var(--cyan);cursor:pointer;transition:all .2s}
  .cta button:hover{background:var(--cyan);color:var(--bg-0);box-shadow:0 0 24px rgba(0,240,255,.6)}

  footer{margin-top:80px;font-family:var(--mono);font-size:12px;color:var(--mute);text-align:center;letter-spacing:.18em}
  footer a{color:var(--cyan);text-decoration:none}

  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 14px var(--cyan)}50%{opacity:.6;box-shadow:0 0 4px var(--cyan)}}

  @media (prefers-reduced-motion: reduce){
    .grid, .scan, .glitch::before, .glitch::after, .hud .cell::after, .nav .dot {animation:none}
  }
</style>
</head>
<body>
<div class="grid"></div>
<div class="scan"></div>

<main>
  <nav>
    <span class="dot"></span>
    <span>SYSTEM // yzh-01.github.io</span>
    <span class="spacer"></span>
    <a href="#">posts</a>
    <a href="#">tags</a>
    <a href="#">about</a>
    <a href="#">rss</a>
  </nav>

  <section class="hero">
    <div class="eyebrow">// signal acquired</div>
    <h1 class="glitch" data-text="Y Z H">Y Z H</h1>
    <p class="sub">代码 / 生活 / <span class="accent">// 还有一切值得记下的</span></p>

    <div class="hud">
      <div class="cell"><div class="k">posts</div><div class="v g">02</div></div>
      <div class="cell"><div class="k">tags</div><div class="v">05</div></div>
      <div class="cell"><div class="k">deploys</div><div class="v g">07</div></div>
      <div class="cell"><div class="k">uptime</div><div class="v">99.9%</div></div>
    </div>
  </section>

  <section class="list">
    <a class="row" href="#">
      <span class="idx">/002</span>
      <span class="t">软件工程期末复习</span>
      <span class="tags"><span class="tag">学习</span><span class="tag">笔记</span></span>
    </a>
    <a class="row" href="#">
      <span class="idx">/001</span>
      <span class="t">No.0 Day</span>
      <span class="tags"><span class="tag">生活</span><span class="tag">随笔</span></span>
    </a>
  </section>

  <div class="cta">
    <p>// signal still warm. 来聊点代码、生活，或者随便什么。</p>
    <button>contact →</button>
  </div>

  <footer>© 2026 yzh · powered by hexo · made in cyber</footer>
</main>
</body>
</html>
