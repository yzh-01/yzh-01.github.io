<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">A modern reading map of the nine realms</title>
  <desc id="desc">Nine commonly named Norse realms arranged around Midgard as relationships rather than fixed geographic positions.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d0b"/>
      <stop offset=".52" stop-color="#111713"/>
      <stop offset="1" stop-color="#070a08"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="44%" r="64%">
      <stop offset="0" stop-color="#718677" stop-opacity=".38"/>
      <stop offset=".64" stop-color="#1d2a22" stop-opacity=".62"/>
      <stop offset="1" stop-color="#0c110e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(17)">
      <path d="M0 2h18M0 11h18" stroke="#d7ddd4" stroke-opacity=".025" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <style>
      .route{fill:none;stroke:#859789;stroke-opacity:.28;stroke-width:2;stroke-dasharray:4 12}
      .branch{fill:none;stroke:#9cab9e;stroke-opacity:.13;stroke-width:3;stroke-linecap:square}
      .scar{fill:none;stroke:#d8ddd5;stroke-opacity:.08;stroke-width:1}
      .node{fill:#121a15;stroke:#8ea092;stroke-opacity:.64;stroke-width:2}
      .node2{fill:none;stroke:#d4dbd1;stroke-opacity:.13;stroke-width:1}
      .mark{fill:none;stroke:#b1c1b4;stroke-width:3;stroke-linecap:square;stroke-linejoin:miter}
      .name{fill:#e1e4dc;font:700 26px Georgia,serif;letter-spacing:4px;text-anchor:middle}
      .domain{fill:#829486;font:600 13px ui-monospace,Consolas,monospace;letter-spacing:3px;text-anchor:middle}
      .index{fill:#73877a;font:600 12px ui-monospace,Consolas,monospace;letter-spacing:2px;text-anchor:middle}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#ground)"/>
  <rect width="1600" height="1000" fill="url(#hatch)"/>
  <circle cx="800" cy="514" r="430" fill="url(#core)"/>
  <circle cx="800" cy="514" r="382" fill="none" stroke="#9baa9d" stroke-opacity=".07"/>
  <circle cx="800" cy="514" r="316" fill="none" stroke="#9baa9d" stroke-opacity=".045" stroke-dasharray="2 15"/>

  <text x="74" y="72" fill="#dfe4dc" font-family="Georgia,serif" font-size="32" font-weight="700" letter-spacing="5">NINE REALMS</text>
  <text x="76" y="103" fill="#7f9283" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="600" letter-spacing="4">A READING MAP / MODERN SYNTHESIS</text>
  <path d="M76 126h348" stroke="#839487" stroke-opacity=".4"/>
  <text x="1524" y="75" fill="#7f9283" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="600" letter-spacing="3" text-anchor="end">RELATIONSHIP, NOT DISTANCE</text>

  <g aria-hidden="true">
    <path class="branch" d="M800 516C778 415 776 320 800 184M800 342c-76-26-149-57-224-102M796 380c88-38 151-78 228-137M796 444c-130-12-240 2-352 60M804 454c137-8 247 8 356 62M796 565c-102 61-177 122-254 200M806 566c99 56 173 121 249 198M800 576c-12 100-10 172 0 251"/>
    <path class="scar" d="M767 306l-22-21m61 83 26-23m-69 98-30-10m91 73 34 13m-75 101-22 28m58-2 24 27M791 717l-27 37m44-2 29 39"/>
    <path d="M754 814c9-82 23-151 46-224 25 75 38 143 48 224" fill="none" stroke="#8b9d90" stroke-opacity=".09" stroke-width="34" filter="url(#soft)"/>
  </g>

  <path class="route" d="M800 500L800 170M800 500L1100 250M800 500L1200 520M800 500L1090 760M800 500L800 840M800 500L495 760M800 500L380 510M800 500L500 250"/>

  <g transform="translate(800 170)">
    <circle class="node" r="76"/><circle class="node2" r="63"/>
    <path class="mark" d="M-22 15v-30L0-36l22 21v30M-13-12h26M0-36v51"/>
    <text class="name" y="108">ASGARD</text><text class="domain" y="132">AESIR</text><text class="index" y="-91">01</text>
  </g>
  <g transform="translate(1100 250)">
    <circle class="node" r="70"/><circle class="node2" r="58"/>
    <path class="mark" d="M0-35V35M-35 0h70M-25-25l50 50M25-25l-50 50"/>
    <text class="name" y="102">ALFHEIM</text><text class="domain" y="126">LIGHT ELVES</text><text class="index" y="-85">02</text>
  </g>
  <g transform="translate(1200 520)">
    <circle class="node" r="70"/><circle class="node2" r="58"/>
    <path class="mark" d="M0 34V-2M0 5c-26-2-34-19-35-34 22 0 33 12 35 34zm0 6c26-2 34-19 35-34-22 0-33 12-35 34z"/>
    <text class="name" y="103">VANAHEIM</text><text class="domain" y="127">VANIR</text><text class="index" y="-85">03</text>
  </g>
  <g transform="translate(1090 760)">
    <circle class="node" r="72"/><circle class="node2" r="60"/>
    <path class="mark" d="M-38 27l26-55L4-2l13-20 26 49M-22 9h47"/>
    <text class="name" y="106">JOTUNHEIM</text><text class="domain" y="130">GIANTS</text><text class="index" y="-87">04</text>
  </g>
  <g transform="translate(800 840)">
    <circle class="node" r="68"/><circle class="node2" r="56"/>
    <path class="mark" d="M0-34v68M0-13l-26-15M0 4l27-17M0 20l-22 19m22-19 22 19"/>
    <text class="name" y="101">HEL</text><text class="domain" y="125">THE DEAD</text><text class="index" y="-83">05</text>
  </g>
  <g transform="translate(495 760)">
    <circle class="node" r="72"/><circle class="node2" r="60"/>
    <path class="mark" d="M-32-25h64v20h-64zM0-5v40M-18 35h36"/>
    <text class="name" y="106">NIDAVELLIR</text><text class="domain" y="130">DWARVES</text><text class="index" y="-87">06</text>
  </g>
  <g transform="translate(380 510)">
    <circle class="node" r="70"/><circle class="node2" r="58"/>
    <path class="mark" d="M0-36v72M-32-18l64 36M32-18l-64 36M-13-31 0-20l13-11M-13 31 0 20l13 11"/>
    <text class="name" y="103">NIFLHEIM</text><text class="domain" y="127">ICE + MIST</text><text class="index" y="-85">07</text>
  </g>
  <g transform="translate(500 250)">
    <circle class="node" r="70"/><circle class="node2" r="58"/>
    <path class="mark" d="M2 37c-27-8-36-28-21-50L-2-39c3 20 22 24 22 44 10-8 12-16 12-25 17 29 5 51-30 57z"/>
    <text class="name" y="102">MUSPELHEIM</text><text class="domain" y="126">FIRE</text><text class="index" y="-85">08</text>
  </g>
  <g transform="translate(800 500)">
    <circle r="99" fill="#101712" stroke="#cdd6cc" stroke-opacity=".72" stroke-width="2"/>
    <circle r="82" fill="none" stroke="#78907d" stroke-opacity=".45" stroke-width="2" stroke-dasharray="3 9"/>
    <path class="mark" d="M0-43c27 0 48 19 48 44S27 45 0 45-48 26-48 1-27-44 0-44zm-26 64L0-5l26 26M0-5v36"/>
    <text class="name" y="133">MIDGARD</text><text class="domain" y="158">HUMAN WORLD / READING CENTRE</text><text class="index" y="-114">09</text>
  </g>

  <path d="M72 930h1456" stroke="#8b9b8e" stroke-opacity=".18"/>
  <text x="74" y="960" fill="#73877a" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="600" letter-spacing="3">COMMON NAMES VARY ACROSS SOURCES · HEL / NIFLHEL · NIDAVELLIR / SVARTALFHEIM</text>
</svg>
