<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — yzh 的小站</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .e404 { padding: 120px 24px 80px; text-align: center; }
  .e404 h1 { font-size: clamp(48px,10vw,120px); font-weight: 700; color: var(--g-accent); letter-spacing: -0.04em; margin-bottom: 12px; }
  .e404 p { font-size: 16px; color: var(--g-text-soft); margin-bottom: 32px; }
  .e404 a { display: inline-block; padding: 10px 24px; background: var(--g-accent); color: #fff; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 14px; }
  .e404 a:hover { background: var(--g-accent-hover); }
</style>
</head>
<body>
<main class="e404">
  <h1>404</h1>
  <p>这页不存在。也许它曾经存在过，也许从未。</p>

</body>
</html>
