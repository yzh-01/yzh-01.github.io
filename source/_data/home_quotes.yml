# 120 条可核验原文语录：哲学 60 / 文艺作品 36 / 宗教经典 24
# text 保留所列版本的原文；work 提供作品与章节定位；source_url 指向核验页。

# Philosophy · 60
- category: "philosophy"
  text: "由于你有可能在此刻辞世，那么相应地调节你的每一行为和思想吧。"
  author: "马可·奥勒留"
  work: "《沉思录》· 卷二 11（何怀宏译）"
  source_url: "https://www.99csw.com/book/469/16005.htm"

- category: "philosophy"
  text: "要记住一切都是意见。"
  author: "马可·奥勒留"
  work: "《沉思录》· 卷二 15（何怀宏译）"
  source_url: "https://www.99csw.com/book/469/16005.htm"

- category: "philosophy"
  text: "这样，一个人就必然笔直地站立，而不是让别人扶着直立。"
  author: "马可·奥勒留"
  work: "《沉思录》· 卷三 5（何怀宏译）"
  source_url: "https://www.99csw.com/book/469/16006.htm"

- category: "philosophy"
  text: "每个人都生存在现在这个时间里，现在是一个不可分的点。"
  author: "马可·奥勒留"
  work: "《沉思录》· 卷三 10（何怀宏译）"
  source_url: "https://www.99csw.com/book/469/16006.htm"

- category: "philosophy"
  text: "宁静不过是心灵的井然有序。"
  author: "马可·奥勒留"
  work: "《沉思录》· 卷四 3（何怀宏译）"
  source_url: "https://www.99csw.com/book/469/16007.htm"

- category: "philosophy"
  text: "死亡像生殖一样是自然的一个秘密。"
  author: "马可·奥勒留"
  work: "《沉思录》· 卷四 5（何怀宏译）"
  source_url: "https://www.99csw.com/book/469/16007.htm"

- category: "philosophy"
  text: "把一切发生的事情都看做是正当地发生的事情。"
  author: "马可·奥勒留"
  work: "《沉思录》· 卷四 10（何怀宏译）"
  source_url: "https://www.99csw.com/book/469/16007.htm"

- category: "philosophy"
  text: "你有理性吗？我有。那为什么你不运用它呢？"
  author: "马可·奥勒留"
  work: "《沉思录》· 卷四 13（何怀宏译）"
  source_url: "https://www.99csw.com/book/469/16007.htm"

- category: "philosophy"
  text: "在各方面都美的一切事物本身就是美的，其美是归于自身的。"
  author: "马可·奥勒留"
  work: "《沉思录》· 卷四 20（何怀宏译）"
  source_url: "https://www.99csw.com/book/469/16007.htm"

- category: "philosophy"
  text: "不要像仿佛你将活一千年那样行动。死亡窥伺着你。"
  author: "马可·奥勒留"
  work: "《沉思录》· 卷四 17（何怀宏译）"
  source_url: "https://www.99csw.com/book/469/16007.htm"

- category: "philosophy"
  text: "No thing great is created suddenly, any more than a bunch of grapes or a fig."
  author: "爱比克泰德"
  work: "《论说集》· I.15.7"
  source_url: "https://en.wikiquote.org/wiki/Epictetus"

- category: "philosophy"
  text: "It is not death or pain that is to be feared, but the fear of pain or death."
  author: "爱比克泰德"
  work: "《论说集》· II.1.13"
  source_url: "https://en.wikiquote.org/wiki/Epictetus"

- category: "philosophy"
  text: "只有受过教育的人才是自由的。"
  author: "爱比克泰德"
  work: "《论说集》· II.1.22"
  source_url: "https://zh.wikiquote.org/wiki/愛比克泰德"

- category: "philosophy"
  text: "Materials are indifferent, but the use which we make of them is not a matter of indifference."
  author: "爱比克泰德"
  work: "《论说集》· II.5.1"
  source_url: "https://en.wikiquote.org/wiki/Epictetus"

- category: "philosophy"
  text: "Although life is a matter of indifference, the use which you make of it is not a matter of indifference."
  author: "爱比克泰德"
  work: "《论说集》· II.6.2"
  source_url: "https://en.wikiquote.org/wiki/Epictetus"

- category: "philosophy"
  text: "It is impossible for anyone to begin to learn that which he thinks he already knows."
  author: "爱比克泰德"
  work: "《论说集》· II.17.1"
  source_url: "https://en.wikiquote.org/wiki/Epictetus"

- category: "philosophy"
  text: "If you would be a good reader, read; if a writer, write."
  author: "爱比克泰德"
  work: "《论说集》· II.18.1"
  source_url: "https://en.wikiquote.org/wiki/Epictetus"

- category: "philosophy"
  text: "Whatever you would make habitual, practice it."
  author: "爱比克泰德"
  work: "《论说集》· II.18.4"
  source_url: "https://en.wikiquote.org/wiki/Epictetus"

- category: "philosophy"
  text: "Know, first, who you are, and then adorn yourself accordingly."
  author: "爱比克泰德"
  work: "《论说集》· III.1.24"
  source_url: "https://en.wikiquote.org/wiki/Epictetus"

- category: "philosophy"
  text: "It was for this that I've been training myself, it was for this that I was practising."
  author: "爱比克泰德"
  work: "《论说集》· III.10.7"
  source_url: "https://en.wikiquote.org/wiki/Epictetus"

- category: "philosophy"
  text: "什么造就英雄？同时面对自己至深的痛苦与至高的希望。"
  author: "弗里德里希·尼采"
  work: "《快乐的科学》· 268（孙周兴译）"
  source_url: "https://zh.wikiquote.org/wiki/弗里德里希·尼采"

- category: "philosophy"
  text: "朋友们啊，世上一切幸福，都是斗争所赐。"
  author: "弗里德里希·尼采"
  work: "《快乐的科学》· 序曲 41（孙周兴译）"
  source_url: "https://zh.wikiquote.org/wiki/弗里德里希·尼采"

- category: "philosophy"
  text: "你的良心在说什么？——你要成为你自己。"
  author: "弗里德里希·尼采"
  work: "《快乐的科学》· 270（孙周兴译）"
  source_url: "https://zh.wikiquote.org/wiki/弗里德里希·尼采"

- category: "philosophy"
  text: "人是一根系在动物与超人之间的绳索，——一根悬在深渊之上的绳索。"
  author: "弗里德里希·尼采"
  work: "《查拉图斯特拉如是说》· 序言 4（孙周兴译）"
  source_url: "https://zh.wikiquote.org/wiki/弗里德里希·尼采"

- category: "philosophy"
  text: "你须意愿在你自己的火焰中焚烧：如若你没有先化为灰烬，你怎能新生！"
  author: "弗里德里希·尼采"
  work: "《查拉图斯特拉如是说》· 第一部·创造者之路（孙周兴译）"
  source_url: "https://zh.wikiquote.org/wiki/弗里德里希·尼采"

- category: "philosophy"
  text: "谁若有一天想要学会飞翔，他就必须首先学会站、走、跑、攀登和舞蹈——人们不能通过飞行而达到飞翔！"
  author: "弗里德里希·尼采"
  work: "《查拉图斯特拉如是说》· 第三部·重力的精神（孙周兴译）"
  source_url: "https://zh.wikiquote.org/wiki/弗里德里希·尼采"

- category: "philosophy"
  text: "对我们来说，不跳一次舞的日子已经失去了。"
  author: "弗里德里希·尼采"
  work: "《查拉图斯特拉如是说》· 第三部·旧牌与新牌（孙周兴译）"
  source_url: "https://zh.wikiquote.org/wiki/弗里德里希·尼采"

- category: "philosophy"
  text: "自从我倦于寻求和探索，我就学会了发现。"
  author: "弗里德里希·尼采"
  work: "《快乐的科学》· 序曲 2（孙周兴译）"
  source_url: "https://zh.wikiquote.org/wiki/弗里德里希·尼采"

- category: "philosophy"
  text: "高尚的灵魂对自身持有敬畏。"
  author: "弗里德里希·尼采"
  work: "《善恶的彼岸》· 9-287（赵千帆译）"
  source_url: "https://zh.wikiquote.org/wiki/弗里德里希·尼采"

- category: "philosophy"
  text: "与怪物搏斗的人必须留神，谨防自己因此也变成怪物。你要是盯着深渊不放，深渊也会盯上你。"
  author: "弗里德里希·尼采"
  work: "《善恶的彼岸》· 4-146（魏一青、黄一蕾、姚一励译）"
  source_url: "https://zh.wikiquote.org/wiki/弗里德里希·尼采"

- category: "philosophy"
  text: "The primary indication, to my thinking, of a well-ordered mind is a man's ability to remain in one place and linger in his own company."
  author: "塞涅卡"
  work: "《致鲁基里乌斯道德书简》· 第 II 封"
  source_url: "https://en.wikiquote.org/wiki/Seneca_the_Younger"

- category: "philosophy"
  text: "Who is everywhere is nowhere."
  author: "塞涅卡"
  work: "《致鲁基里乌斯道德书简》· II.2"
  source_url: "https://en.wikiquote.org/wiki/Seneca_the_Younger"

- category: "philosophy"
  text: "Withdraw into yourself, as far as you can. Associate with those who will make a better man of you."
  author: "塞涅卡"
  work: "《致鲁基里乌斯道德书简》· VII.8"
  source_url: "https://en.wikiquote.org/wiki/Seneca_the_Younger"

- category: "philosophy"
  text: "The best ideas are common property."
  author: "塞涅卡"
  work: "《致鲁基里乌斯道德书简》· XII.11"
  source_url: "https://en.wikiquote.org/wiki/Seneca_the_Younger"

- category: "philosophy"
  text: "There are more things, Lucilius, likely to frighten us than there are to crush us; we suffer more often in imagination than in reality."
  author: "塞涅卡"
  work: "《致鲁基里乌斯道德书简》· 第 XIII 封"
  source_url: "https://en.wikiquote.org/wiki/Seneca_the_Younger"

- category: "philosophy"
  text: "If you would not have a man flinch when the crisis comes, train him before it comes."
  author: "塞涅卡"
  work: "《致鲁基里乌斯道德书简》· 第 XVIII 封"
  source_url: "https://en.wikiquote.org/wiki/Seneca_the_Younger"

- category: "philosophy"
  text: "Prove your words by your deeds."
  author: "塞涅卡"
  work: "《致鲁基里乌斯道德书简》· 第 XX 封"
  source_url: "https://en.wikiquote.org/wiki/Seneca_the_Younger"

- category: "philosophy"
  text: "Men do not care how nobly they live, but only how long."
  author: "塞涅卡"
  work: "《致鲁基里乌斯道德书简》· XXII.17"
  source_url: "https://en.wikiquote.org/wiki/Seneca_the_Younger"

- category: "philosophy"
  text: "It is indeed foolish to be unhappy now because you may be unhappy at some future time."
  author: "塞涅卡"
  work: "《致鲁基里乌斯道德书简》· 第 XXIV 封"
  source_url: "https://en.wikiquote.org/wiki/Seneca_the_Younger"

- category: "philosophy"
  text: "Therefore, my dear Lucilius, begin at once to live, and count each separate day as a separate life."
  author: "塞涅卡"
  work: "《致鲁基里乌斯道德书简》· 第 CI 封"
  source_url: "https://en.wikiquote.org/wiki/Seneca_the_Younger"

- category: "philosophy"
  text: "学而时习之，不亦说乎？"
  author: "孔子"
  work: "《论语》· 学而第一"
  source_url: "https://zh.wikisource.org/zh-hans/論語/學而第一"

- category: "philosophy"
  text: "有朋自远方来，不亦乐乎？"
  author: "孔子"
  work: "《论语》· 学而第一"
  source_url: "https://zh.wikisource.org/zh-hans/論語/學而第一"

- category: "philosophy"
  text: "人不知而不愠，不亦君子乎？"
  author: "孔子"
  work: "《论语》· 学而第一"
  source_url: "https://zh.wikisource.org/zh-hans/論語/學而第一"

- category: "philosophy"
  text: "温故而知新，可以为师矣。"
  author: "孔子"
  work: "《论语》· 为政第二"
  source_url: "https://zh.wikisource.org/zh-hans/論語/為政第二"

- category: "philosophy"
  text: "知之为知之，不知为不知，是知也。"
  author: "孔子"
  work: "《论语》· 为政第二"
  source_url: "https://zh.wikisource.org/zh-hans/論語/為政第二"

- category: "philosophy"
  text: "三人行，必有我师焉。"
  author: "孔子"
  work: "《论语》· 述而第七"
  source_url: "https://zh.wikisource.org/zh-hans/論語/述而第七"

- category: "philosophy"
  text: "择其善者而从之，其不善者而改之。"
  author: "孔子"
  work: "《论语》· 述而第七"
  source_url: "https://zh.wikisource.org/zh-hans/論語/述而第七"

- category: "philosophy"
  text: "逝者如斯夫，不舍昼夜。"
  author: "孔子"
  work: "《论语》· 子罕第九"
  source_url: "https://zh.wikisource.org/zh/論語/子罕第九"

- category: "philosophy"
  text: "岁寒，然后知松柏之后凋也。"
  author: "孔子"
  work: "《论语》· 子罕第九"
  source_url: "https://zh.wikisource.org/zh/論語/子罕第九"

- category: "philosophy"
  text: "己所不欲，勿施于人。"
  author: "孔子"
  work: "《论语》· 颜渊第十二"
  source_url: "https://zh.wikisource.org/zh-hant/論語/顏淵第十二"

- category: "philosophy"
  text: "至人无己，神人无功，圣人无名。"
  author: "庄子"
  work: "《庄子》· 逍遥游"
  source_url: "https://zh.wikisource.org/zh-hans/莊子/逍遙遊"

- category: "philosophy"
  text: "小知不及大知，小年不及大年。"
  author: "庄子"
  work: "《庄子》· 逍遥游"
  source_url: "https://zh.wikisource.org/zh-hans/莊子/逍遙遊"

- category: "philosophy"
  text: "天地与我并生，而万物与我为一。"
  author: "庄子"
  work: "《庄子》· 齐物论"
  source_url: "https://zh.wikisource.org/zh-hans/莊子/齊物論"

- category: "philosophy"
  text: "方生方死，方死方生；方可方不可，方不可方可。"
  author: "庄子"
  work: "《庄子》· 齐物论"
  source_url: "https://zh.wikisource.org/zh-hans/莊子/齊物論"

- category: "philosophy"
  text: "吾生也有涯，而知也无涯。"
  author: "庄子"
  work: "《庄子》· 养生主"
  source_url: "https://zh.wikisource.org/zh-hans/莊子/養生主"

- category: "philosophy"
  text: "指穷于为薪，火传也，不知其尽也。"
  author: "庄子"
  work: "《庄子》· 养生主"
  source_url: "https://zh.wikisource.org/zh-hans/莊子/養生主"

- category: "philosophy"
  text: "泉涸，鱼相与处于陆，相呴以湿，相濡以沫，不如相忘于江湖。"
  author: "庄子"
  work: "《庄子》· 大宗师"
  source_url: "https://zh.wikisource.org/zh-hans/莊子/大宗師"

- category: "philosophy"
  text: "人生天地之间，若白驹之过隙，忽然而已。"
  author: "庄子"
  work: "《庄子》· 知北游"
  source_url: "https://zh.wikisource.org/zh-hans/莊子/知北遊"

- category: "philosophy"
  text: "巧者劳而知者忧，无能者无所求。"
  author: "庄子"
  work: "《庄子》· 列御寇"
  source_url: "https://zh.wikisource.org/zh-hans/莊子/列禦寇"

- category: "philosophy"
  text: "狗不以善吠为良，人不以善言为贤。"
  author: "庄子"
  work: "《庄子》· 徐无鬼"
  source_url: "https://zh.wikisource.org/zh-hans/莊子/徐無鬼"

# Fiction, games and anime · 36
- category: "fiction"
  text: "这个世界需要更多的英雄。"
  author: "猎空"
  work: "《守望先锋》CG 动画 · 角色台词"
  source_url: "https://overwatch.huijiwiki.com/wiki/《守望先锋》CG动画"

- category: "fiction"
  text: "可以失败，不能放弃。"
  author: "禅雅塔"
  work: "《守望先锋》· 游戏语音"
  source_url: "https://overwatch.huijiwiki.com/wiki/禅雅塔/台词和语音"

- category: "fiction"
  text: "科学永无止境！"
  author: "温斯顿"
  work: "《守望先锋》· 赛前等待语音"
  source_url: "https://overwatch.huijiwiki.com/wiki/温斯顿/台词和语音"

- category: "fiction"
  text: "真正的骑士什么时代都一样勇敢，小历史学家。现在的世界需要我们。"
  author: "莱因哈特"
  work: "《守望先锋》· 英雄互动语音"
  source_url: "https://overwatch.huijiwiki.com/wiki/莱因哈特/台词和语音"

- category: "fiction"
  text: "别忘了照顾好自己呀。"
  author: "天使"
  work: "《守望先锋》· 英雄互动语音"
  source_url: "https://overwatch.huijiwiki.com/wiki/天使/台词和语音"

- category: "fiction"
  text: "放空思想，专注在手头的任务上。"
  author: "源氏"
  work: "《守望先锋》· 赛前等待语音"
  source_url: "https://overwatch.huijiwiki.com/wiki/源氏/台词和语音"

- category: "fiction"
  text: "勇气并非来自体力，而是来自不屈不挠的意志。"
  author: "半藏"
  work: "《守望先锋》· 旧版赛前等待语音"
  source_url: "https://overwatch.huijiwiki.com/wiki/半藏/台词和语音"

- category: "fiction"
  text: "大家齐心协力！我来承受伤害！"
  author: "D.Va"
  work: "《守望先锋》· 赛前等待语音"
  source_url: "https://overwatch.huijiwiki.com/wiki/D.Va/台词和语音"

- category: "fiction"
  text: "你杀不死希望。"
  author: "黑百合"
  work: "《守望先锋》· 复生语音"
  source_url: "https://overwatch.huijiwiki.com/wiki/黑百合/台词和语音"

- category: "fiction"
  text: "我像相信家人一样相信着我的队友。希望有一天你也能这样做。"
  author: "美"
  work: "《守望先锋》· 英雄互动语音"
  source_url: "https://overwatch.huijiwiki.com/wiki/台词和语音/2.21.1"

- category: "fiction"
  text: "人都要面对自己的战斗，朋友。对我们来说，每个微笑都是一场胜利。"
  author: "莱因哈特"
  work: "《守望先锋》· 英雄互动语音"
  source_url: "https://overwatch.huijiwiki.com/wiki/莱因哈特/台词和语音"

- category: "fiction"
  text: "团结之中才能找到力量。"
  author: "奥丽莎"
  work: "《守望先锋》· 选择英雄语音"
